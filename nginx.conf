server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ============================================
    # 📋 CABECERAS DE SEGURIDAD (VERSIÓN COMPLETA)
    # ============================================
    
    # Control de framing (quién puede incrustar tu sitio)
    add_header X-Frame-Options "SAMEORIGIN" always;
    
    # Política de Seguridad de Contenido (CSP) - Unificada y completa
    # Permite: tu mismo dominio, YouTube (sin cookies), Google Fonts, y recursos externos confiables
    add_header Content-Security-Policy "
        default-src 'self';
        script-src 'self' 'unsafe-inline' https://www.youtube-nocookie.com https://www.google.com;
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
        font-src 'self' https://fonts.gstatic.com;
        img-src 'self' data: https:;
        frame-src 'self' https://www.youtube-nocookie.com;
        frame-ancestors 'self';
        upgrade-insecure-requests;
    " always;
    
    # Prevención de sniffing MIME
    add_header X-Content-Type-Options "nosniff" always;
    
    # Protección XSS (modo moderno)
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Control de referer
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Prevenir que los navegadores adivinen el tipo de contenido
    add_header X-Download-Options "noopen" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;

    # Compresión Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # Cache de archivos estáticos
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Manejo de robots.txt y sitemap.xml
    location = /robots.txt {
        add_header Content-Type text/plain;
    }

    location = /sitemap.xml {
        add_header Content-Type application/xml;
    }

    # Manejo de rutas (SPA)
    error_page 404 /index.html;
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
